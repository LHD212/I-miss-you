<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：适配手机屏幕，防止被缩放和裁切 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>你只属于我</title>
    <style>
        body {
            background-color: #000000;
            color: #ff2a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            /* 字体调小，防止溢出 */
            font-size: 7px; 
            line-height: 1.1;
            text-shadow: 0 0 5px #ff2a2a, 0 0 10px #ff2a2a;
        }
        pre {
            margin: 0;
            padding: 0;
            white-space: pre;
        }
    </style>
</head>
<body>
    <pre id="heart"></pre>

    <script>
        let c = 8;
        // 改成了中文，和你的标题呼应，加空格排版更好看
        const str = "I LOVE YOU! "; 
        let output = "";
        
        // 缩小了 x 和 y 的绘制范围，并调整了步长，让总宽度缩窄，刚好适应手机屏幕
        for (let y = 1.2; y > -1.0; y -= 0.06) {
            for (let x = -1.2; x < 1.2; x += 0.045) {
                let a = x * x + y * y - 1; 
                // 经典心形公式，弧度完美
                if (a * a * a - x * x * y * y * y <= 0) {
                    let n = c % str.length;
                    output += str.charAt(n);
                    c++;
                } else {
                    output += " ";
                }
            }
            output += "\n";
        }
        
        document.getElementById("heart").textContent = output;
    </script>
</body>
</html>
