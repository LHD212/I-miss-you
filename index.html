<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送给你的专属礼物</title>
    <style>
        body {
            background-color: #000000;
            color: #ff2a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace; /* 等宽字体是灵魂 */
            font-size: 12px;
            line-height: 1.1; 
            text-shadow: 0 0 5px #ff2a2a, 0 0 10px #ff2a2a; /* 发光特效 */
        }
        pre {
            margin: 0;
            letter-spacing: 1px; /* 稍微拉开一点横向间距 */
        }
    </style>
</head>
<body>
    <pre id="heart"></pre>

    <script>
        let c = 8;
        const str = "I LOVE YOU! "; 
        let output = "";
        
        // 数学公式：(x^2 + y^2 - 1)^3 - x^2 * y^3 <= 0
        // y 控制高度，x 控制宽度。根据字符 1:2 的长宽比，y的步长是x的两倍
        // y 从 1.3 递减到 -1.1，覆盖大约 50 行
        // x 从 -1.4 递增到 1.4，覆盖大约 100 列
        for (let y = 1.3; y > -1.1; y -= 0.048) {
            for (let x = -1.4; x < 1.4; x += 0.028) {
                // 经典心形方程
                let a = x * x + y * y - 1; 
                if (a * a * a - x * x * y * y * y <= 0) {
                    let n = c % str.length;
                    output += str.charAt(n);
                    c++;
                } else {
                    output += " ";
                }
            }
            output += "\n";
        }
        
        document.getElementById("heart").textContent = output;
    </script>
</body>
</html>
